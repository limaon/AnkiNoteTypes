<script>
  // Split hierarchical tags
  var tagsContainerEl = document.querySelectorAll(".prettify-tags > *");
  if (tagsContainerEl.length > 0) {
    var tags = [];
    tagsContainerEl.forEach((tagEl) => {
      tagEl.classList.add("prettify-tag");
      tags.push(tagEl.innerHTML);
      tags.forEach((tag) => {
        var childTag = tag.split("::").filter(Boolean);
        tagEl.innerHTML = childTag[childTag.length - 1].trim();
      });
    });
  } else {
    tagsContainerEl = document.querySelector(".prettify-tags");
    var tags = tagsContainerEl.innerHTML.split(" ").filter(Boolean);
    var html = "";
    tags.forEach((tag) => {
      var childTag = tag.split("::").filter(Boolean);
      html +=
        "<span class='prettify-tag'>" +
        childTag[childTag.length - 1] +
        "</span>";
    });
    tagsContainerEl.innerHTML = html;
  }
</script>

<script>
  // Breadcrumbs to current deck
  var deckEl = document.querySelector(".prettify-deck");
  if (deckEl) {
    var subDecks = deckEl.innerHTML.split("::").filter(Boolean);
    var html = [];
    subDecks.forEach((subDeck) => {
      html.push("<span class='prettify-subdeck'>" + subDeck + "</span>");
    });
    deckEl.innerHTML = html.join("&nbsp;/&nbsp;");
  }
</script>

<script>
  // Random colors for bold text;
  var randomIndex = Math.floor(Math.random() * 9 + 1);
  var randomColor = "var(--color-" + randomIndex + ")";
  document.documentElement.style.setProperty("--random-color", randomColor);
</script>

<script>
  // Detecta overflow no campo back e adiciona classe has-overflow para a sombra
  function checkBackFieldOverflow() {
    const backField = document.querySelector(".prettify-field--back");
    if (backField) {
      const hasOverflow = backField.scrollHeight > backField.clientHeight;
      backField.classList.toggle("has-overflow", hasOverflow);
    }
  }

  // Executar ao carregar (com delay para garantir renderização)
  setTimeout(checkBackFieldOverflow, 100);

  // Executar ao redimensionar
  window.addEventListener("resize", checkBackFieldOverflow);

  // Observer para detectar mudanças no conteúdo
  const backField = document.querySelector(".prettify-field--back");
  if (backField && !window.backFieldObserver) {
    const observer = new MutationObserver(() => {
      setTimeout(checkBackFieldOverflow, 50);
    });
    observer.observe(backField, {
      childList: true,
      subtree: true,
      characterData: true,
    });
    window.backFieldObserver = observer;
  }
</script>
